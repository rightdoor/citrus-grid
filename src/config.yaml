# 站点地址，用于 sitemap 、 RSS 等地方，留空使用内置预设
# Site URL used for sitemap, RSS, etc. Leave empty to use the built-in preset
# 例：https://example.com
# e.g. https://example.com
url:

# 站点信息，留空使用内置预设
# Site info. Leave empty to use the built-in preset
title:
subtitle:
description:

# 首页卡片的头像和网站图标 Logo ， public/ 下的静态路径，以 / 开头；留空使用内置预设
# Avatar and site logo for the home profile card. Static paths under public/, starting with /. Leave empty to use the built-in preset
# 例：/avatar.webp、/logo.webp
# e.g. /avatar.webp, /logo.webp
avatar:
logo:

# 作者，留空使用内置预设
# Author name. Leave empty to use the built-in preset
author:

# 默认语言， zh 、 ja 、 en ，留空使用内置预设
# Default language: zh, ja, en. Leave empty to use the built-in preset
defaultLang:

# 默认主题，auto 、 light 、 dark ，留空使用内置预设
# Default theme: auto, light, dark. Leave empty to use the built-in preset
defaultTheme:

# 首页每页文章数，留空使用内置预设
# Posts per page on the home page. Leave empty to use the built-in preset
postsPerPage:

# 个人名片社交按钮，留空则不显示社交按钮
# Social buttons on the profile card. Leave empty to hide the social buttons
# 支持： github 、 twitter 、 linkedin 、 youtube 、instagram 、 facebook 、 devto 、 medium 、 rss 、 email 、 website ，没有独立设置图标的使用通用链接图标
# Supported: github, twitter, linkedin, youtube, instagram, facebook, devto, medium, rss, email, website. Platforms without a dedicated icon fall back to a generic link icon
socials:
  - platform: github
    url: https://github.com/rightdoor
  - platform: rss
    url: /rss.xml

# 统计脚本，脚本位于 src/stats/ 目录，契约详见 src/stats/使用规则.md
# Statistics script. Scripts live in src/stats/, see src/stats/使用规则.md for the plugin contract
statsScript: random-visitor

# 友链，留空显示空状态页。icon 放在 public/friends/ 下，引用以 /friends/文件名.后缀
# Friend links. Leave empty to show an empty state. Icons go under public/friends/ and are referenced as /friends/filename.ext
friends:
  - url: https://www.endlesssolo.com
    name: 我的博客
    desc: 我的个人博客
    icon: /friends/endlesssolo.webp

# 评论脚本，脚本位于 src/comments/ 目录，契约详见 src/comments/使用规则.md
# Comment script. Scripts live in src/comments/, see src/comments/usageRules.md for the adapter contract
# 留空则不启用评论区
# Leave empty to disable the comment section
commentScript:
